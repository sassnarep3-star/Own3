name: build-check

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    name: Audit, build and link-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Regenerate data, pages and docs
        run: node tools/audit.mjs && node tools/build-site.mjs

      - name: Fail if generated output is out of date
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Generated files are stale. Run 'npm run build' and commit the result."
            git status --porcelain
            git diff --stat
            exit 1
          fi

      - name: Link check (publish gate)
        run: node tools/check-links.mjs

      - name: Report dataset counts
        run: |
          node -e "
            const r = require('./data/audit-report.json');
            console.log('listings      ', r.totals.listings);
            console.log('verified      ', r.totals.verifiedThisSession);
            console.log('official-src  ', r.totals.officialLinked);
            console.log('flagged       ', r.totals.flagged);
            console.log('prize types   ', JSON.stringify(r.prizeType));
          "

name: Validate and deploy Prize Scout

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
      - name: Check generated files are up to date
        run: |
          node tools/build_data.js
          node tools/build_log.js
          node tools/build_site.js
          git diff --exit-code || (echo "Generated files are stale: run the build tools and commit." && exit 1)
      - name: Validate catalog and local links
        run: node scripts/validate-catalog.mjs
      - name: Validate archived Prize Scout build
        run: node scripts/validate-prize-scout-archive.mjs

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6.0.0
      - name: Upload static site
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
